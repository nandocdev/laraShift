name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast:
    name: Suite rápida (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, sqlite3, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: CI check (pint + pest sobre SQLite)
        run: composer ci:check

  rls:
    name: RLSEnforce (Postgres real)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saas
          POSTGRES_PASSWORD: saas
          POSTGRES_DB: saas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U saas"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, pgsql, pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: RLS isolation suite
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: saas_test
          DB_USERNAME: saas
          DB_PASSWORD: saas
          RLS_ENFORCE_IN_TESTS: 'true'
        run: vendor/bin/pest --colors=never --group=RLSEnforce
